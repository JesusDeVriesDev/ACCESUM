<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Accesum · Wireframes interactivos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B2A5B;--navy2:#071B3D;--gold:#F5B21B;--bg:#E9EDF5;--card:#fff;--ink:#14213D;--mut:#5A6785;--line:#D3DAE8;--soft:#F2F5FA;--ok:#17703F;--okb:#DDF3E6;--par:#8A5200;--parb:#FFEBC7;--no:#A8211B;--nob:#FBE0DE;--map:#E4E9F2;--bld:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1226;--card:#121C38;--ink:#EAF0FF;--mut:#A3B0CE;--line:#2A3963;--soft:#0F1830;--ok:#6EE0A0;--okb:#123826;--par:#FFC66B;--parb:#3B2A08;--no:#FF9C94;--nob:#42150F;--map:#0F1830;--bld:#1A2748}}
:root[data-theme="dark"]{--bg:#0A1226;--card:#121C38;--ink:#EAF0FF;--mut:#A3B0CE;--line:#2A3963;--soft:#0F1830;--ok:#6EE0A0;--okb:#123826;--par:#FFC66B;--parb:#3B2A08;--no:#FF9C94;--nob:#42150F;--map:#0F1830;--bld:#1A2748}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:"Atkinson Hyperlegible",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.stage{display:grid;grid-template-columns:270px 410px 300px;gap:28px;justify-content:center;align-items:start;padding:28px 16px}
.side h1{font-size:22px;margin:0 0 4px;color:var(--navy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .side h1{color:var(--gold)}}
.side p{color:var(--mut);margin:0 0 14px;font-size:14px}
.flows{display:grid;gap:8px;margin:0 0 14px;padding:0;list-style:none}
.flows button{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:44px}
.flows button b{display:block;font-size:14px}.flows button span{font-size:12px;color:var(--mut)}
.flows button[aria-current=true]{border-color:var(--navy);box-shadow:inset 4px 0 0 var(--gold)}
.note{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;color:var(--mut)}
.note h2{margin:0 0 6px;font-size:15px;color:var(--ink)}.note dl{margin:0}.note dt{font-weight:700;color:var(--ink);margin-top:6px}.note dd{margin:0}
.sw{display:flex;gap:6px;margin-top:10px}.sw i{width:26px;height:26px;border-radius:6px;border:1px solid var(--line)}
.phone{width:390px;height:780px;background:var(--navy2);border-radius:38px;padding:10px;box-shadow:0 20px 50px rgba(7,27,61,.35)}
.app{height:100%;background:var(--soft);border-radius:30px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.top{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;min-height:56px;border-bottom:4px solid var(--gold)}
.top h2{margin:0;font-size:18px;flex:1}.top button{background:none;border:0;color:#fff;font-size:14px;text-decoration:underline;cursor:pointer;min-height:44px;padding:0 4px}
.top .back{font-size:22px;text-decoration:none}
.body{flex:1;overflow:auto;padding:14px 16px}
.tabs{display:flex;background:var(--card);border-top:1px solid var(--line)}
.tabs button{flex:1;min-height:56px;border:0;background:none;cursor:pointer;font-weight:700;color:var(--mut);border-top:4px solid transparent}
.tabs button[aria-selected=true]{color:var(--navy);border-top-color:var(--gold);background:var(--soft)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button[aria-selected=true]{color:var(--gold)}}
.f{display:block;margin:0 0 12px}.f>span{display:block;font-size:14px;font-weight:700;margin-bottom:4px}
select,input[type=text],input[type=number],input[type=email],input[type=password]{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);padding:8px 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip,.seg button{min-height:44px;padding:6px 14px;border:1.5px solid var(--line);border-radius:22px;background:var(--card);cursor:pointer}
.chip[aria-pressed=true],.seg button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.seg{display:flex;gap:8px;margin-bottom:12px}.seg button{flex:1;border-radius:10px}
.btn{width:100%;min-height:50px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;font-size:16px;cursor:pointer;margin:6px 0}
.btn.alt{background:var(--card);color:var(--navy);border:2px solid var(--navy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.alt{color:var(--gold);border-color:var(--gold)}}
.btn.gold{background:var(--gold);color:var(--navy2)}
.link{display:block;text-align:center;background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;min-height:44px;width:100%}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;min-height:56px}
.item div{flex:1}.item small{display:block;color:var(--mut)}
.badge{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:14px;white-space:nowrap}
.b-acc{background:var(--okb);color:var(--ok)}.b-par{background:var(--parb);color:var(--par)}.b-no{background:var(--nob);color:var(--no)}
.alert{border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px;border-left:5px solid}
.a-ok{background:var(--okb);border-color:var(--ok)}.a-par{background:var(--parb);border-color:var(--par)}.a-no{background:var(--nob);border-color:var(--no)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row b{font-weight:700}
h3{margin:4px 0 8px;font-size:17px}.mut{color:var(--mut);font-size:14px}
svg.map{width:100%;height:auto;background:var(--map);border-radius:12px;border:1px solid var(--line);display:block}
.bld{cursor:pointer}.bld rect{fill:var(--bld);stroke:var(--navy);stroke-width:2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bld rect{stroke:var(--gold)}}
.bld.sel rect{fill:var(--gold);stroke:var(--navy)}.bld.dim{opacity:.35}.bld:focus-visible rect{stroke:#E5322D;stroke-width:4}
.bld text{fill:var(--ink);font-size:11px;font-weight:700;pointer-events:none}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:8px 0}
.right .note{margin-bottom:12px}.right h2{font-size:15px}
.pill{display:inline-block;background:var(--navy);color:#fff;border-radius:6px;padding:1px 7px;font-size:12px;margin:0 4px 4px 0}
body.solo .side,body.solo .right{display:none}body.solo .stage{grid-template-columns:410px;min-height:100vh;align-items:center}
@media (max-width:1050px){.stage{grid-template-columns:1fr;padding:0}.side,.right{display:none}.phone{width:100%;height:100dvh;border-radius:0;padding:0;box-shadow:none}.app{border-radius:0}}
@media (prefers-reduced-motion:no-preference){.body>*{animation:in .18s ease-out}@keyframes in{from{opacity:.4}to{opacity:1}}}
</style>
</head>
<body class="solo">
<div class="stage">
  <aside class="side">
    <h1>Accesum</h1>
    <p>Wireframes interactivos · Campus Centro, Universidad CESMAG. Prueba cada flujo como en la app.</p>
    <ul class="flows" id="flows"></ul>
    <div class="note"><h2>Colores y decisiones</h2>
      <div class="sw"><i style="background:#0B2A5B"></i><i style="background:#F5B21B"></i><i style="background:#17703F"></i><i style="background:#8A5200"></i><i style="background:#A8211B"></i></div>
      <dl><dt>Estado de accesibilidad</dt><dd>Nunca solo color: siempre texto e icono (RNF02).</dd><dt>Datos</dt><dd>Valores de ejemplo, no verificados en terreno.</dd></dl>
    </div>
  </aside>
  <main class="phone"><div class="app" id="app"></div></main>
  <aside class="right" id="right"></aside>
</div>

<script>
// ---------- Datos de ejemplo ----------
const B={sf:{n:"San Francisco",niv:6,asc:true,x:30,y:70,w:110,h:80},it:{n:"Italia",niv:4,asc:false,x:175,y:35,w:115,h:65},ho:{n:"Holanda",niv:5,asc:false,x:175,y:125,w:115,h:65},sb:{n:"Sede B",niv:2,asc:false,x:40,y:205,w:95,h:48}};
const CATS=["Aula","Biblioteca","Baño","Oficina","Cafetería","Coliseo","Laboratorio"];
const mk=(id,n,cat,b,p,niv,w,r,a,ba,s,v,g)=>({id,n,cat,b,p,niv,w,r,a,ba,s,v,g});
let SP=[
 mk(1,"Biblioteca Remigio Fiore Fortezza","Biblioteca","ho","Holanda, piso 1","par",90,1,0,1,1,"15/09/2026","DS"),
 mk(2,"Consultorio Jurídico San Juan de Capistrano","Oficina","sb","Sede B, piso 1","acc",100,1,0,1,1,"15/09/2026","DS"),
 mk(3,"Comunicaciones","Oficina","sf","San Francisco, piso 1","acc",110,1,1,1,1,"30/09/2026","JD"),
 mk(4,"Aula de informática","Aula","sf","San Francisco, piso 2","par",90,1,1,0,1,"15/09/2026","DS"),
 mk(5,"Vicerrectoría Académica","Oficina","sf","San Francisco, mezzanine 2","acc",100,1,1,1,1,"15/09/2026","DS"),
 mk(6,"Auditorio San Francisco","Aula","sf","San Francisco, piso 1","acc",150,1,1,1,1,"30/09/2026","JD"),
 mk(7,"Baño accesible Italia","Baño","it","Italia, piso 1","acc",95,1,0,1,1,"10/09/2026","DS"),
 mk(8,"Laboratorio de física","Laboratorio","it","Italia, piso 2","no",70,0,0,0,0,"10/09/2026","DS"),
 mk(9,"Cafetería Italia","Cafetería","it","Italia, piso 1","acc",120,1,0,1,1,"10/09/2026","DS")];
let SG=[
 {id:1,n:"Pasillo",d:"Portería San Francisco → San Francisco, piso 1",t:"Pasillo",w:140,sl:0,ob:"Ninguno",niv:"acc"},
 {id:2,n:"Ascensor",d:"San Francisco, piso 1 a 3",t:"Ascensor",w:110,sl:0,ob:"Ninguno",niv:"acc"},
 {id:3,n:"Rampa a Italia",d:"San Francisco, piso 3 → Italia",t:"Rampa",w:120,sl:6,ob:"Ninguno",niv:"acc"},
 {id:4,n:"Escalera a Holanda",d:"Holanda, piso 3 a 4 · sin ascensor",t:"Escalera",w:100,sl:0,ob:"Escalones",niv:"no"}];
const LV={acc:["✓","Accesible","b-acc"],par:["◐","Parcial","b-par"],no:["✕","No accesible","b-no"]};
const badge=n=>`<span class="badge ${LV[n][2]}">${LV[n][0]} ${LV[n][1]}</span>`;
const sy=v=>v?"Sí":"No";

// ---------- Anotaciones por pantalla (traza del documento) ----------
const NOTE={
 mapa:["Flujo 3 · 3A Mapa","Punto de entrada. Toca un edificio; activa «Con ascensor» para ver solo San Francisco.","RF05, RF09 · HU03","Ver espacios del edificio","Sin capas satelitales, clima ni eventos."],
 buscar:["Flujo 2 · 2A Buscador","Categorías RF01 + filtro por edificio y ascensor.","RF01, RF02 · HU01","Buscar sitio","Sin calificaciones, comentarios, fotos ni favoritos."],
 ficha:["Flujo 2 · 2B Ficha NTC 6047","Muestra fecha y gestor de la última verificación (RF08). En Sede B (2B’) no hay «Cómo llegar».","RF02, RF08 · HU01","Cómo llegar","—"],
 ruta:["Flujo 1 · 1A Origen y destino","Perfil fijo: silla de ruedas. La ruta usa el estado real de los segmentos (edítalos en Gestor).","RF03, RF04, RF05 · HU02","Calcular ruta accesible","Sin voz y sin selector múltiple de perfiles."],
 login:["Flujo 4 · 4A Iniciar sesión","Acceso restringido a gestores. Demo con credenciales de prueba.","RF06, RNF05 · HU04","Iniciar sesión","Sin autoregistro, sin «olvidé contraseña», sin «recordarme»."],
 fichas:["Flujo 4 · 4B Lista de fichas","Aviso de confirmación al guardar (4D).","RF06, RF08 · HU04","Registrar ficha","—"],
 ficha_f:["Flujo 4 · 4C Registrar / editar ficha","Al guardar se actualiza fecha y gestor (RF08).","RF06, RF08 · HU04","Guardar ficha de accesibilidad","—"],
 segs:["Flujo 5 · 5A Lista de segmentos","Filtrable por edificio. Toca una fila para editar.","RF07 · HU04","(tocar fila)","—"],
 seg_f:["Flujo 5 · 5B Editar segmento","Los cambios afectan el cálculo de rutas del Flujo 1.","RF07 · HU04","Guardar segmento","Sin herramientas de dibujo libre."]};

// ---------- Estado ----------
const S={scr:"mapa",bld:null,asc:false,cat:null,fb:"",fa:false,sp:null,org:"Portería San Francisco",dst:1,res:false,gest:false,flash:null,ed:null,sg:null,sfb:"",hist:[]};
const $=id=>document.getElementById(id);
function go(s,push=true){if(push&&S.scr!==s)S.hist.push(S.scr);S.scr=s;render();$("app").querySelector(".body")?.scrollTo(0,0)}
function back(){S.scr=S.hist.pop()||"mapa";render();$("app").querySelector(".body")?.scrollTo(0,0)}
const userTabs=["mapa","buscar","ficha","ruta"],gestTabs=["fichas","segs","ficha_f","seg_f"];

// ---------- Mapa SVG ----------
function mapSVG(route){
 let s=`<svg class="map" viewBox="0 0 320 270" role="img" aria-label="Mapa esquemático del Campus Centro"><path d="M140 110 H175" stroke="var(--mut)" stroke-width="8" opacity=".35"/><text x="150" y="128" font-size="9" fill="var(--mut)">puente</text>`;
 for(const k in B){const b=B[k],sel=S.bld===k,dim=S.asc&&!b.asc&&!route;
  s+=`<g class="bld ${sel?"sel":""} ${dim?"dim":""}" ${route?"":`tabindex="0" role="button" data-b="${k}" aria-label="${b.n}${b.asc?", con ascensor":""}"`}><rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="6" ${k=="sb"?'stroke-dasharray="6 4"':''}/><text x="${b.x+8}" y="${b.y+20}">${b.n}</text>${b.asc?`<circle cx="${b.x+b.w-16}" cy="${b.y+16}" r="11" fill="#0B2A5B"/><text x="${b.x+b.w-20}" y="${b.y+20}" style="fill:#fff;font-size:11px">⇅</text>`:""}</g>`}
 s+=`<text x="40" y="262" font-size="9" fill="var(--mut)">Sede B (aparte, sin conexión peatonal)</text>`;
 if(route){const P={p:[18,110],sf:[85,112],it:[232,68],ho:[232,158]};
  s+=`<circle cx="18" cy="110" r="7" fill="#F5B21B" stroke="#0B2A5B" stroke-width="2"/><text x="6" y="98" font-size="9" fill="var(--ink)">Portería</text>`;
  let prev=P.p;route.forEach(g=>{const to=g.to;const st=g.niv=="acc"?'stroke="#17703F"':g.niv=="par"?'stroke="#B26A00" stroke-dasharray="8 5"':'stroke="#A8211B" stroke-dasharray="2 6" stroke-linecap="round"';
   s+=`<line x1="${prev[0]}" y1="${prev[1]}" x2="${P[to][0]}" y2="${P[to][1]}" ${st} stroke-width="5"/>`;prev=P[to]});
  s+=`<circle cx="${prev[0]}" cy="${prev[1]}" r="8" fill="#0B2A5B" stroke="#fff" stroke-width="2"/>`}
 return s+"</svg>"}

// ---------- Pantallas ----------
const V={};
V.mapa=()=>{const b=S.bld&&B[S.bld];return `<div class="chips"><button class="chip" aria-pressed="${S.asc}" data-act="asc">⇅ Con ascensor</button></div>${mapSVG()}
<div class="sheet">${b?`<h3>${b.n}</h3><div class="row"><span>Niveles</span><b>${b.niv}</b></div><div class="row"><span>Ascensor disponible</span><b>${sy(b.asc)}</b></div>${S.bld=="sb"?`<p class="mut">Sede B queda aparte: no hay ruta peatonal interna desde los otros edificios.</p>`:""}<button class="btn" data-act="verEsp">Ver espacios del edificio</button>`:`<p class="mut" style="margin:0">Toca un edificio para ver sus niveles y si tiene ascensor. Solo San Francisco cuenta con ascensor operativo.</p>`}</div>`};
V.buscar=()=>{const L=SP.filter(s=>(!S.cat||s.cat==S.cat)&&(!S.fb||s.b==S.fb)&&(!S.fa||B[s.b].asc));
 let h=`<div class="chips" role="group" aria-label="Categoría">${CATS.map(c=>`<button class="chip" aria-pressed="${S.cat==c}" data-cat="${c}">${c}</button>`).join("")}</div>
 <label class="f"><span>Edificio</span><select data-sel="fb"><option value="">Todos los edificios</option>${Object.keys(B).map(k=>`<option value="${k}" ${S.fb==k?"selected":""}>${B[k].n}</option>`).join("")}</select></label>
 <div class="chips"><button class="chip" aria-pressed="${S.fa}" data-act="fa">⇅ Con ascensor</button></div>
 <button class="btn" data-act="buscar">Buscar sitio</button>`;
 if(S.res){h+=`<p class="mut"><b>${L.length}</b> ${L.length==1?"sitio encontrado":"sitios encontrados"}</p>`+(L.length?L.map(s=>`<button class="item" data-sp="${s.id}"><div><b>${s.n}</b><small>${s.p}</small></div>${badge(s.niv)}</button>`).join(""):`<div class="alert a-par">Sin resultados. Prueba otra categoría o quita el filtro de ascensor.</div>`)}
 return h+`<button class="link" data-act="gest">Acceso de gestores</button>`};
V.ficha=()=>{const s=SP.find(x=>x.id==S.sp)||SP[0],sb=s.b=="sb";
 return `<h3>${s.n}</h3><p class="mut" style="margin:0 0 10px">${s.p}</p>
 <div class="card"><div class="row"><span>Nivel de accesibilidad</span>${badge(s.niv)}</div><div class="row"><span>Acceso en silla de ruedas</span><b>${sy(s.niv!="no")}</b></div><div class="row"><span>Ancho de acceso</span><b>${s.w} cm</b></div><div class="row"><span>Rampa de acceso</span><b>${sy(s.r)}</b></div><div class="row"><span>Ascensor</span><b>${sy(s.a)}</b></div><div class="row"><span>Baño adaptado</span><b>${sy(s.ba)}</b></div><div class="row"><span>Señalización accesible</span><b>${sy(s.s)}</b></div></div>
 <p class="mut">✔ Verificado el ${s.v} por Gestor ${s.g} · NTC 6047</p>
 ${sb?`<div class="alert a-par">Queda en la Sede B. No hay ruta peatonal interna desde los otros edificios.</div><button class="btn alt" data-act="resultados">Volver a los resultados</button>`:`<button class="btn" data-act="comoLlegar">Cómo llegar</button>`}`};
V.ruta=()=>{const opts=SP.map(s=>`<option value="${s.id}" ${S.dst==s.id?"selected":""}>${s.n} · ${B[s.b].n}</option>`).join("");
 let h=`<label class="f"><span>Origen</span><select data-sel="org"><option ${S.org=="Portería San Francisco"?"selected":""}>Portería San Francisco</option></select></label>
 <label class="f"><span>Destino</span><select data-sel="dst">${opts}</select></label>
 <div class="f"><span>Perfil de movilidad</span><div class="chips"><button class="chip" aria-pressed="true">♿ Silla de ruedas</button></div></div>
 <button class="btn" data-act="calc">Calcular ruta accesible</button>`;
 if(S.res2){const d=SP.find(x=>x.id==S.dst),r=calc(d);
  h+=`<hr style="border:0;border-top:1px solid var(--line);margin:12px 0">`;
  if(!r){h+=`<div class="alert a-no"><b>Sin conexión peatonal.</b> ${d.n} queda en la Sede B, aparte de los otros edificios. No hay recorrido interno hasta allá.</div>${mapSVG([])}`}
  else{const bad=r.find(g=>g.niv=="no"),par=r.find(g=>g.niv=="par");
   h+=bad?`<div class="alert a-no"><b>No existe una ruta 100 % accesible.</b> ${bad.n} tiene una barrera. Verifica con el personal antes de ir.</div>`:par?`<div class="alert a-par"><b>Ruta con tramos parciales.</b> Hay tramos parcialmente accesibles.</div>`:`<div class="alert a-ok"><b>Ruta accesible</b> sin escaleras ni barreras.</div>`;
   h+=mapSVG(r)+`<div class="legend"><span>━ Accesible</span><span>╍ Parcial</span><span>···· No accesible</span></div>`+r.map((g,i)=>`<div class="item" style="cursor:default"><div><b>${i+1} · ${g.n}</b><small>${g.d}</small></div>${badge(g.niv)}</div>`).join("")}
  h+=`<button class="btn alt" data-act="nueva">Nueva ruta</button>`}
 return h};
function calc(d){if(d.b=="sb")return null;const g=i=>SG.find(x=>x.id==i);const o=[{...g(1),to:"sf"}];
 if(d.b=="sf"&&!/piso 1/.test(d.p))o.push({...g(2),to:"sf"});
 if(d.b=="it"||d.b=="ho"){o.push({...g(2),to:"sf"},{...g(3),to:"it"})}
 if(d.b=="ho")o.push({...g(4),to:"ho"});return o}
V.login=()=>`<h3>Acceso de gestores</h3><p class="mut">Solo personal autorizado. No se recolectan datos de quienes consultan.</p>
 ${S.err?`<div class="alert a-no" role="alert"><b>Correo o contraseña incorrectos.</b> Verifica tus datos e intenta de nuevo.</div>`:""}<label class="f"><span>Correo</span><input type="email" id="em" value="${S.em||""}" placeholder="gestor@unicesmag.edu.co"></label><label class="f"><span>Contraseña</span><input type="password" id="pw"></label><button class="btn" data-act="login">Iniciar sesión</button><button class="link" data-act="volver">Volver a la consulta</button>`;
V.fichas=()=>{const L=SP.filter(s=>!S.sfb||s.b==S.sfb);return `${S.flash?`<div class="alert a-ok" role="status"><b>Ficha guardada exitosamente</b><br>${S.flash}</div>`:""}
 <label class="f"><span>Edificio</span><select data-sel="sfb"><option value="">Todos los edificios</option>${Object.keys(B).map(k=>`<option value="${k}" ${S.sfb==k?"selected":""}>${B[k].n}</option>`).join("")}</select></label>
 ${L.map(s=>`<button class="item" data-ed="${s.id}"><div><b>${s.n}</b><small>${s.p}</small></div>${badge(s.niv)}</button>`).join("")}<button class="btn" data-act="nuevaFicha">Registrar ficha</button>`};
V.ficha_f=()=>{const e=S.ed,s=e?SP.find(x=>x.id==e):{n:"",b:"sf",niv:"acc",w:90,r:1,a:0,ba:0,s:0,cat:"Aula"};
 const yn=(k,l)=>`<div class="f"><span>${l}</span><div class="seg">${[1,0].map(v=>`<button type="button" data-yn="${k}" data-v="${v}" aria-pressed="${!!s[k]==!!v}">${v?"Sí":"No"}</button>`).join("")}</div></div>`;
 S.draft=S.draft||{...s};const d=S.draft;
 return `<h3>${e?"Editar ficha":"Nueva ficha"}</h3>
 <label class="f"><span>Nombre del espacio</span><input type="text" id="fn" value="${d.n}" ${e?"readonly":""}></label>
 <label class="f"><span>Edificio</span><select id="fe">${Object.keys(B).map(k=>`<option value="${k}" ${d.b==k?"selected":""}>${B[k].n}</option>`).join("")}</select></label>
 <div class="f"><span>Nivel de accesibilidad</span><div class="seg">${["acc","par","no"].map(n=>`<button type="button" data-lv="${n}" aria-pressed="${d.niv==n}">${LV[n][1]}</button>`).join("")}</div></div>
 <label class="f"><span>Ancho de acceso (cm)</span><input type="number" id="fw" value="${d.w}" min="0"></label>
 ${["r","Rampa de acceso","a","Ascensor","ba","Baño adaptado","s","Señalización accesible"].reduce((a,x,i,arr)=>i%2?a:a+yn(x,arr[i+1]),"")}
 <p class="mut">Al guardar se registra la fecha de verificación y tu nombre de gestor.</p>
 <button class="btn" data-act="guardarFicha">Guardar ficha de accesibilidad</button><button class="link" data-act="cancelar">Cancelar</button>`};
V.segs=()=>`<label class="f"><span>Edificio</span><select><option>San Francisco</option></select></label><p class="mut">Toca un segmento para actualizar su nivel de accesibilidad.</p>${SG.map(g=>`<button class="item" data-sg="${g.id}"><div><b>${g.n}</b><small>${g.d}</small></div>${badge(g.niv)}</button>`).join("")}`;
V.seg_f=()=>{const g=S.dg||(S.dg={...SG.find(x=>x.id==S.sg)});
 return `<div class="card"><b>${g.n}</b><div class="mut">${g.d}</div></div>
 <div class="f"><span>Tipo de segmento</span><div class="seg">${["Pasillo","Rampa","Escalera"].map(t=>`<button type="button" data-tp="${t}" aria-pressed="${g.t==t}">${t}</button>`).join("")}</div></div>
 <label class="f"><span>Ancho libre (cm)</span><input type="number" id="gw" value="${g.w}"></label><label class="f"><span>Pendiente (%)</span><input type="number" id="gs" value="${g.sl}"></label><label class="f"><span>Obstáculos</span><input type="text" id="go" value="${g.ob}"></label>
 <div class="f"><span>Nivel de accesibilidad</span><div class="seg">${["acc","par","no"].map(n=>`<button type="button" data-gl="${n}" aria-pressed="${g.niv==n}">${LV[n][1]}</button>`).join("")}</div></div>
 <button class="btn" data-act="guardarSeg">Guardar segmento</button>`};

// ---------- Render ----------
const TITLE={mapa:"Mapa del Campus Centro",buscar:"Buscar sitio",ficha:"Ficha de accesibilidad",ruta:"Ruta accesible",login:"Gestores",fichas:"Fichas",ficha_f:"Ficha",segs:"Segmentos",seg_f:"Editar segmento"};
function render(){const _sc=$("app").querySelector(".body")?.scrollTop||0;const sc=S.scr,gest=gestTabs.includes(sc)||sc=="login",deep=["ficha","ficha_f","seg_f","login"].includes(sc);
 let tabs="";
 if(!gest||sc=="login"&&false){tabs=`<div class="tabs" role="tablist"><button role="tab" aria-selected="${sc=="mapa"}" data-go="mapa">🗺 Mapa</button><button role="tab" aria-selected="${sc=="buscar"||sc=="ficha"}" data-go="buscar">🔍 Buscar</button><button role="tab" aria-selected="${sc=="ruta"}" data-go="ruta">➜ Ruta</button></div>`}
 else if(sc!="login"){tabs=`<div class="tabs" role="tablist"><button role="tab" aria-selected="${sc=="fichas"||sc=="ficha_f"}" data-go="fichas">Fichas</button><button role="tab" aria-selected="${sc=="segs"||sc=="seg_f"}" data-go="segs">Segmentos</button></div>`}
 $("app").innerHTML=`<header class="top">${deep?`<button class="back" data-act="back" aria-label="Volver">‹</button>`:""}<h2>${TITLE[sc]}</h2>${gest&&sc!="login"?`<button data-act="salir">Salir</button>`:""}${!gest&&sc=="mapa"?`<button data-act="gest">Gestor</button>`:""}</header><div class="body">${V[sc]()}</div>${tabs}`;
 const n=NOTE[sc];$("right").innerHTML=`<div class="note"><h2>${n[0]}</h2><p style="margin:0 0 8px">${n[1]}</p><dl><dt>Trazabilidad</dt><dd>${n[2].split(/[,·]\s*/).map(x=>`<span class="pill">${x.trim()}</span>`).join("")}</dd><dt>CTA único</dt><dd>${n[3]}</dd><dt>YAGNI</dt><dd>${n[4]}</dd></dl></div>`;
 const fl={mapa:3,buscar:2,ficha:2,ruta:1,login:4,fichas:4,ficha_f:4,segs:5,seg_f:5}[sc];
 document.querySelectorAll("#flows button").forEach(b=>b.setAttribute("aria-current",b.dataset.f==fl));const bd=$("app").querySelector(".body");if(bd)bd.scrollTop=_sc}

// ---------- Eventos ----------
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-act],[data-go],[data-b],[data-cat],[data-sp],[data-ed],[data-sg],[data-yn],[data-lv],[data-tp],[data-gl],[data-f]");if(!t)return;const d=t.dataset;
 if(d.f){const m={1:["ruta"],2:["buscar"],3:["mapa"],4:["login"],5:["segs"]}[d.f][0];S.hist=[];S.gest=m=="segs"||m=="login";if(m=="ruta")S.res2=false;go(m,false);return}
 if(d.go){S.hist=[];if(d.go=="ruta")S.res2=false;go(d.go,false);return}
 if(d.b){S.bld=d.b;render();$("app").querySelector("[data-b='"+d.b+"']")?.focus();return}
 if(d.cat){S.cat=S.cat==d.cat?null:d.cat;S.res=false;render();return}
 if(d.sp){S.sp=+d.sp;go("ficha");return}
 if(d.ed){S.ed=+d.ed;S.draft=null;go("ficha_f");return}
 if(d.sg){S.sg=+d.sg;S.dg=null;go("seg_f");return}
 const pick=()=>{t.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===t))};
 if(d.yn){S.draft[d.yn]=+d.v;pick();return}
 if(d.lv){S.draft.niv=d.lv;pick();return}
 if(d.tp){S.dg.t=d.tp;pick();return}
 if(d.gl){S.dg.niv=d.gl;pick();return}
 const a=d.act;
 if(a=="asc"){S.asc=!S.asc;render()}
 else if(a=="verEsp"){S.fb=S.bld;S.cat=null;S.res=true;S.hist=[];go("buscar",false)}
 else if(a=="fa"){S.fa=!S.fa;S.res=false;render()}
 else if(a=="buscar"){S.res=true;render()}
 else if(a=="resultados"){back()}
 else if(a=="comoLlegar"){S.dst=S.sp;S.res2=false;go("ruta")}
 else if(a=="calc"){S.res2=true;render()}
 else if(a=="nueva"){S.res2=false;render()}
 else if(a=="gest"){go("login")}
 else if(a=="volver"||a=="back"){back()}
 else if(a=="login"){const em=$("em").value.trim().toLowerCase(),pw=$("pw").value;
  if(em=="gestor@unicesmag.edu.co"&&pw=="Accesum2026"){S.err=false;S.em="";S.gest=true;S.hist=[];S.flash=null;go("fichas",false)}
  else{S.err=true;S.em=em;render();$("pw").focus()}}
 else if(a=="salir"){S.gest=false;S.hist=[];go("mapa",false)}
 else if(a=="nuevaFicha"){S.ed=null;S.draft=null;go("ficha_f")}
 else if(a=="cancelar"){S.draft=null;back()}
 else if(a=="guardarFicha"){const dr=S.draft;dr.n=$("fn").value.trim()||"Nuevo espacio";dr.b=$("fe").value;dr.w=+$("fw").value;dr.v="29/10/2026";dr.g="JD";
  if(S.ed){Object.assign(SP.find(x=>x.id==S.ed),dr)}else SP.push({...dr,id:Date.now(),cat:"Aula",p:B[dr.b].n+", piso 1"});
  S.flash=`${dr.n} · Verificada el 29/10/2026 por Gestor JD`;S.draft=null;S.hist=[];go("fichas",false)}
 else if(a=="guardarSeg"){const g=S.dg;g.w=+$("gw").value;g.sl=+$("gs").value;g.ob=$("go").value;Object.assign(SG.find(x=>x.id==S.sg),g);S.dg=null;S.hist=[];go("segs",false)}
});
document.addEventListener("change",e=>{const k=e.target.dataset.sel;if(!k)return;
 if(k=="dst"){S.dst=+e.target.value;S.res2=false}else S[k]=e.target.value;if(k=="fb")S.res=false;render()});
document.addEventListener("keydown",e=>{if((e.key=="Enter"||e.key==" ")&&e.target.matches("g.bld")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});
document.addEventListener("keydown",e=>{const inField=e.target.matches("input,select,textarea");
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=="a"&&!inField){e.preventDefault();document.body.classList.toggle("solo")}
 else if(e.key=="Escape")document.body.classList.remove("solo")});
$("flows").innerHTML=[["Consultar ruta accesible","Origen y destino → ruta"],["Buscar espacio y ver ficha","Categoría → ficha NTC 6047"],["Mapa del campus","Edificios y ascensores"],["Registrar ficha (gestor)","Login → lista → formulario"],["Actualizar segmento (gestor)","Lista → editar tramo"]].map((f,i)=>`<li><button data-f="${i+1}"><b>Flujo ${i+1} · ${f[0]}</b><span>${f[1]}</span></button></li>`).join("");
render();
</script>
</body>
</html>
